<text x="208" y="468" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">6 角色</text>
<rect x="545" y="336.875" width="56" height="103.125" rx="6" fill="#34d399"/>
<text x="573" y="327.875" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#334155">3.75</text>
<text x="573" y="468" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">6 角色</text>
<rect x="275" y="231.0" width="56" height="209.0" rx="6" fill="#f59e0b"/>
<text x="303" y="222.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#334155">23.75</text>
<text x="303" y="468" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">8 角色</text>
