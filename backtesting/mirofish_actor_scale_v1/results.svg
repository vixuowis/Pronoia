<text x="435" y="176" font-family="Arial,sans-serif" font-size="13" fill="#64748b">情景分支实际引用的不同角色</text>
<text x="800" y="150" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0f172a">预测价值：两种证据</text>
<rect x="85" y="347.6" width="56" height="92.4" rx="6" fill="#60a5fa"/>
<text x="113" y="338.6" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#334155">10.50</text>
<text x="113" y="468" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">4 角色</text>
<rect x="450" y="330.0" width="56" height="110.0" rx="6" fill="#60a5fa"/>
<text x="478" y="321.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#334155">4.00</text>
<text x="478" y="468" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">4 角色</text>
