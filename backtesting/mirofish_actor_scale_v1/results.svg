<text x="668" y="468" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">8 角色</text>
<text x="800" y="190" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#334155">历史事件概率（12 事件 / 24 目标）</text>
<text x="800" y="221" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#059669">Brier 0.1573 → 0.1525</text>
<text x="800" y="248" font-family="Arial,sans-serif" font-size="14" fill="#047857">相对改善 3.06% · 11/12 事件未变差 · 8/9 概率调整改善</text>
<line x1="800" y1="279" x2="1130" y2="279" stroke="#e2e8f0"/>
<text x="800" y="316" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#334155">T+3 方向资格赛（开发集 n=6）</text>
<text x="800" y="347" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#dc2626">Brier 0.635 → 0.949</text>
<text x="800" y="374" font-family="Arial,sans-serif" font-size="14" fill="#b91c1c">未通过：方向未改变，置信度反而过高</text>
<rect x="800" y="404" width="330" height="72" rx="9" fill="#f1f5f9"/>
<text x="816" y="432" font-family="Arial,sans-serif" font-size="14" fill="#334155">完成率 100% · P90 99.5 秒</text>
<text x="816" y="458" font-family="Arial,sans-serif" font-size="14" fill="#334155">单次均价 $0.0041</text>
<text x="55" y="580" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">结论</text>
<text x="55" y="612" font-family="Arial,sans-serif" font-size="15" fill="#334155">增加角色确实扩展了行动层，但四条情景分支未同步吸收更多角色；下一步应优化情景汇总，而非继续盲目扩容。</text>
<text x="55" y="640" font-family="Arial,sans-serif" font-size="14" fill="#64748b">工程可用性与预测有效性分开报告；合成情景不是新证据，也不是可交易概率。</text>
</svg>