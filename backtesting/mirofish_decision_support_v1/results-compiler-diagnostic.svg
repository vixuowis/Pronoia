<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">情景编译器 v5 与 v6 决策支持诊断</title>
<desc id="desc">在相同模拟输入上比较角色覆盖、绝对质量、严格合格率和事件路径覆盖。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#172033}
.title{font-size:30px;font-weight:600}.subtitle{font-size:17px;fill:#596579}.panel{font-size:20px;font-weight:600}
.label{font-size:16px;fill:#374151}.value{font-size:17px;font-weight:600}.track{fill:#e8edf3}.note{font-size:15px;fill:#596579}
</style>
<rect width="1200" height="820" fill="#ffffff"/>
<text x="64" y="60" class="title">覆盖提升，语义增量仍需复核</text>
<text x="64" y="92" class="subtitle">12 个案例 · 每版固定 4 条情景 · 单组绝对双评 · 事后诊断</text>
<text x="64" y="138" class="panel">有效决策角色覆盖率</text>
<text x="180" y="152" class="label">v5</text><rect x="180" y="160" width="760" height="20" rx="3" class="track"/><rect x="180" y="160" width="570.00" height="20" rx="3" fill="#64748b"/><text x="954" y="175" class="value">75.0%</text>
<text x="180" y="202" class="label">v6</text><rect x="180" y="210" width="760" height="20" rx="3" class="track"/><rect x="180" y="210" width="760.00" height="20" rx="3" fill="#2563eb"/><text x="954" y="225" class="value">100.0%</text>
<text x="64" y="292" class="panel">绝对质量均分（满分 20）</text>
<text x="180" y="306" class="label">v5</text><rect x="180" y="314" width="760" height="20" rx="3" class="track"/><rect x="180" y="314" width="413.25" height="20" rx="3" fill="#64748b"/><text x="954" y="329" class="value">10.88</text>
<text x="180" y="356" class="label">v6</text><rect x="180" y="364" width="760" height="20" rx="3" class="track"/><rect x="180" y="364" width="410.08" height="20" rx="3" fill="#2563eb"/><text x="954" y="379" class="value">10.79</text>
<text x="64" y="446" class="panel">严格合格情景率</text>
<text x="180" y="460" class="label">v5</text><rect x="180" y="468" width="760" height="20" rx="3" class="track"/><rect x="180" y="468" width="95.00" height="20" rx="3" fill="#64748b"/><text x="954" y="483" class="value">12.5%</text>
<text x="180" y="510" class="label">v6</text><rect x="180" y="518" width="760" height="20" rx="3" class="track"/><rect x="180" y="518" width="142.50" height="20" rx="3" fill="#2563eb"/><text x="954" y="533" class="value">18.8%</text>
<text x="64" y="600" class="panel">完整事件路径 Recall@4</text>
<text x="180" y="614" class="label">v5</text><rect x="180" y="622" width="760" height="20" rx="3" class="track"/><rect x="180" y="622" width="380.00" height="20" rx="3" fill="#64748b"/><text x="954" y="637" class="value">50.0%</text>
<text x="180" y="664" class="label">v6</text><rect x="180" y="672" width="760" height="20" rx="3" class="track"/><rect x="180" y="672" width="380.00" height="20" rx="3" fill="#2563eb"/><text x="954" y="687" class="value">50.0%</text>
<line x1="64" y1="760" x2="1136" y2="760" stroke="#d5dce5"/>
<text x="64" y="792" class="note">角色覆盖为确定性指标；质量与路径因双评一致性低于 80% 仅作探索性描述。质量配对：v6 胜 6 · v5 胜 5 · 平 1。</text>
</svg>