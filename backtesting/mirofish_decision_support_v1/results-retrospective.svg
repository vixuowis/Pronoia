<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">多智能体情景决策支持回顾性评测</title>
<desc id="desc">比较单智能体 A 和多智能体 B 的质量、严格合格情景率与完整事件路径覆盖。</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC',sans-serif;fill:#172033}
.title{font-size:30px;font-weight:600}.subtitle{font-size:17px;fill:#596579}.panel{font-size:21px;font-weight:600}
.label{font-size:16px;fill:#374151}.value{font-size:17px;font-weight:600}.track{fill:#e8edf3}
.note{font-size:15px;fill:#596579}
</style>
<rect width="1200" height="720" fill="#ffffff"/>
<text x="64" y="62" class="title">多智能体情景：价值不只在“猜中”</text>
<text x="64" y="94" class="subtitle">12 个历史案例 · 每组固定 4 条情景 · 24 个事件目标 · 换序双评</text>
<text x="64" y="145" class="panel">匿名质量均分（满分 20）</text>
<text x="180" y="161" class="label">A 单智能体</text><rect x="180" y="169" width="760" height="22" rx="3" class="track"/><rect x="180" y="169" width="514.58" height="22" rx="3" fill="#64748b"/><text x="954" y="185" class="value">13.54</text>
<text x="180" y="216" class="label">B 多智能体</text><rect x="180" y="224" width="760" height="22" rx="3" class="track"/><rect x="180" y="224" width="478.17" height="22" rx="3" fill="#2563eb"/><text x="954" y="240" class="value">12.58</text>
<text x="64" y="311" class="panel">严格合格情景率</text>
<text x="180" y="327" class="label">A 单智能体</text><rect x="180" y="335" width="760" height="22" rx="3" class="track"/><rect x="180" y="335" width="380.00" height="22" rx="3" fill="#64748b"/><text x="954" y="351" class="value">50.0%</text>
<text x="180" y="382" class="label">B 多智能体</text><rect x="180" y="390" width="760" height="22" rx="3" class="track"/><rect x="180" y="390" width="79.17" height="22" rx="3" fill="#2563eb"/><text x="954" y="406" class="value">10.4%</text>
<text x="64" y="477" class="panel">完整事件路径 Recall@4</text>
<text x="180" y="493" class="label">A 单智能体</text><rect x="180" y="501" width="760" height="22" rx="3" class="track"/><rect x="180" y="501" width="316.67" height="22" rx="3" fill="#64748b"/><text x="954" y="517" class="value">41.7%</text>
<text x="180" y="548" class="label">B 多智能体</text><rect x="180" y="556" width="760" height="22" rx="3" class="track"/><rect x="180" y="556" width="253.33" height="22" rx="3" fill="#2563eb"/><text x="954" y="572" class="value">33.3%</text>
<line x1="64" y1="650" x2="1136" y2="650" stroke="#d5dce5"/>
<text x="64" y="684" class="note">质量分差在 10/12 例随左右顺序翻转；本图只作回顾性问题诊断，不代表交易收益。</text>
</svg>